name: Test and build Whisper PWA
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check app and export tests
        run: npm run check
      - name: Prepare Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: '3.1.74'
      - name: Build whisper.cpp from pinned upstream tag
        run: bash scripts/build-wasm.sh
      - name: Create production files
        run: bash scripts/assemble.sh
      - name: Check runtime files and headers
        run: |
          test -s dist/runtime/libmain.js
          test -s dist/runtime/libmain.wasm
          test -s dist/_headers
          test -s dist/sw.js
      - uses: actions/upload-artifact@v4
        with:
          name: whisper-private-pwa-dist
          path: dist/
          retention-days: 7
      - name: Install real-browser test dependencies
        run: |
          npm install --no-save playwright@1.64.1
          npx playwright install --with-deps chromium
      - name: Fetch publicly available test audio and tiny model
        run: |
          curl -fLSs --retry 3 -o /tmp/ggml-tiny-q5_1.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny-q5_1.bin
          curl -fLSs --retry 3 -o /tmp/jfk.wav https://raw.githubusercontent.com/ggml-org/whisper.cpp/master/samples/jfk.wav
          test $(stat -c %s /tmp/ggml-tiny-q5_1.bin) -gt 1000000
          test $(stat -c %s /tmp/jfk.wav) -gt 1000
      - name: Real speech recognition and no-upload browser test
        run: node scripts/browser-e2e.mjs /tmp/ggml-tiny-q5_1.bin /tmp/jfk.wav
      # Deploy only after real browser transcription and privacy regression tests.
